name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: node sync.mjs --check
      - run: node --test core/test/*.test.mjs watch/test/*.test.mjs
